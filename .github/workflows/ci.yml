name: Build

env:
  PERIPHERY_VERSION: "3.8.0"

on:
  push:
    tags:
      - "v*"
    branches:
      - "*"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Set up Buildx with the docker-container driver, which supports
      # GitHub Actions cache (the default docker driver does not).
      - uses: docker/setup-buildx-action@v3

      # Build the CI image with Docker layer caching so the Periphery
      # build stage is only re-run when the version or Dockerfile changes.
      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pir-tester-ci:latest
          build-args: |
            PERIPHERY_VERSION=${{ env.PERIPHERY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify tool versions
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            pir-tester-ci:latest make tools

      # Run linters
      - name: Run linters
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            pir-tester-ci:latest make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pir-tester-ci:latest
          build-args: |
            PERIPHERY_VERSION=${{ env.PERIPHERY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print swift version
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            pir-tester-ci:latest swift --version

      # Run tests
      - name: Run tests
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            pir-tester-ci:latest make test

  build:
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: pir-tester-ci:latest
          build-args: |
            PERIPHERY_VERSION=${{ env.PERIPHERY_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print swift version
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            pir-tester-ci:latest swift --version

      - name: Build project
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            pir-tester-ci:latest make build

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: See [CHANGELOG.md](./CHANGELOG.md) for the list of changes.
          draft: false
          prerelease: false
